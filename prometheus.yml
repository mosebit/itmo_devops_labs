global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'airflow'
    static_configs:
      - targets:
          - 'statsd-exporter:9102'

  - job_name: 'spark-master'
    metrics_path: /metrics/master/prometheus/
    static_configs:
      - targets:
          - 'spark-master:8080'

  - job_name: 'spark-applications'
    metrics_path: /metrics/applications/prometheus/
    static_configs:
      - targets:
          - 'spark-master:8080'
